name: Refresh npm registry metadata cassettes

on:
  schedule:
    - cron: '0 9 5 * *'
  workflow_dispatch:

jobs:
  capture:
    if: vars.ENABLE_REGISTRY_CASSETTE_REFRESH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Capture exact versions observed in the starter
        id: capture
        run: >-
          python3 -m scripts.capture_registry
          --packages-file config/registry-capture-packages.json
          --output tests/fixtures/registry-cassettes
      - name: Propose review of captured bytes
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: chore/npm-registry-cassettes
          commit-message: 'chore: refresh captured npm registry metadata'
          title: Refresh captured npm registry metadata
          body: |
            Refresh exact-version public npm metadata and its SHA-256 index.
            Review the captured bytes, package identities and publisher changes.
            This does not vet packages, update the approved ledger, or establish audit_passed.
          add-paths: tests/fixtures/registry-cassettes
      - name: Preserve partial capture or rejected PR as an artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-registry-capture-${{ github.run_id }}-incomplete-or-unpublished
          path: tests/fixtures/registry-cassettes
          retention-days: 30
